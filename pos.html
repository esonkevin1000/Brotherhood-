<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="mobile-web-app-capable" content="yes">
<title>Brotherhood POS</title>
<style>
:root{--bg:#121214;--panel:#1c1c20;--panel2:#26262c;--line:#33333b;--text:#f1f1f3;--mute:#9a9aa6;--gold:#d4a24c;--ok:#4cc38a;--bad:#ef5b5b;--info:#5b9bef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}header small{display:block;color:var(--mute);font-size:12px}
.burger{background:var(--panel2);border:0;color:var(--text);width:40px;height:40px;border-radius:10px;font-size:20px}
main{padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stat{display:flex;gap:12px;align-items:center}.stat .ic{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:22px}
.stat small{color:var(--mute);display:block;font-size:12px}.stat b{font-size:22px;display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--gold);color:#111;font-weight:700;cursor:pointer}
button.ghost{background:var(--panel2);color:var(--text)}button.bad{background:var(--bad);color:#fff}button.ok{background:var(--ok);color:#06210f}
button.sm{padding:7px 12px;font-size:13px;border-radius:9px}button:disabled{opacity:.4}
button.block{width:100%}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font:inherit}
label{display:block;color:var(--mute);font-size:12px;margin:10px 0 4px}
.mute{color:var(--mute)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2)}
.tag.waiting,.tag.present{color:var(--gold)}.tag.in_chair,.tag.late{color:var(--info)}.tag.paid{color:var(--ok)}.tag.void,.tag.off{color:var(--bad)}.tag.break{color:#c78be8}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bottom div{display:flex;width:100%;max-width:560px}
nav.bottom button{flex:1;background:none;color:var(--mute);border-radius:0;padding:10px 4px;font-size:11px;font-weight:600}
nav.bottom button span{display:block;font-size:20px}nav.bottom button.on{color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:600}.chip.on{background:var(--gold);color:#111;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px;text-align:left;color:var(--text);font-weight:600}
.item b{color:var(--gold);font-size:17px;margin-top:8px}.item small{color:var(--mute);font-weight:400}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:0 14px;z-index:5;max-width:560px;margin:0 auto}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:12px}.seg button{flex:1;background:none;color:var(--mute);padding:10px}.seg button.on{background:var(--gold);color:#111}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:560px;margin:auto auto 0;max-height:92vh;overflow:auto}
dialog::backdrop{background:#000b}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.pin button{background:var(--panel2);color:var(--text);font-size:22px;padding:16px}
.dots{display:flex;gap:12px;justify-content:center;margin:16px 0}.dots i{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}.dots i.on{background:var(--gold)}
.qty{display:flex;align-items:center;gap:8px}.qty button{padding:4px 12px;font-size:18px}
.drawer a{display:block;padding:14px;border-radius:10px;color:var(--text)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 18px;border-radius:99px;font-weight:700;z-index:99}
.toast.err{background:var(--bad);color:#fff}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
#print{display:none}
.paper{background:#fff;color:#111;font:12px/1.4 'Courier New',monospace;padding:14px;border-radius:8px;max-width:340px;margin:0 auto}
.paper .r{display:flex;justify-content:space-between;gap:10px}.paper .r span:last-child{text-align:right}.paper .c{text-align:center}.paper h3{text-align:center;margin:0 0 2px;font-size:14px}
.paper hr{border-top:1px dashed #111;margin:8px 0}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .paper{max-width:none;width:72mm;padding:0;margin:0;border-radius:0}
  @page{margin:4mm}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"></dialog>
<div id="print"></div>
<script src="/pos.js"></script>
</body>
</html>
