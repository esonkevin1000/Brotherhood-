<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brotherhood">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<title>Brotherhood POS</title>
<style>
:root{--bg:#f5f5f6;--s1:#ffffff;--s2:#f7f7f8;--s3:#ececef;--line:#e1e1e6;--text:#0d0d0f;--mute:#6b6b76;--gold:#0d0d0f;--gold2:#000000;--grad:linear-gradient(135deg,#2c2c31,#000);--ok:#16a870;--bad:#e5384a;--info:#2b7de9;--vio:#7c4dff;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Inter',system-ui,Segoe UI,Roboto,sans-serif}
body{background:var(--bg)}
h1,h2,h3,.num{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;letter-spacing:.4px;font-weight:600}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:104px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:16px;height:16px}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 14px 14px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(135deg,#d6283a 0 9px,#f4f1ea 9px 18px,#2563eb 18px 27px);opacity:.85}
header .ttl{flex:1;min-width:0}header h1{margin:0;font-size:19px;text-transform:uppercase;line-height:1.1}
header small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:13px;background:var(--s2);color:var(--text);border:1px solid var(--line)}
.shiftchip{font-size:11px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.shiftchip.on{color:#0c7a50;border-color:#a8e3c9;background:#e8f8f1}
main{padding:16px 14px}
.card{position:relative;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 6px 22px -14px rgba(0,0,0,.28)}
.hero{border:0;background:linear-gradient(135deg,#25252a,#000);color:#fff;overflow:hidden}.hero .mute{color:#b4b4be}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hero small{color:#c2c2cc;text-transform:uppercase;letter-spacing:1.2px;font-size:11px;font-weight:600}
.hero .num{font-size:44px;line-height:1.05;margin:4px 0;color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.kpis .card{margin:0}
.kpi .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px;background:rgba(13,13,15,.07);color:var(--gold)}
.kpi.b .ic{background:rgba(90,167,255,.14);color:var(--info)}.kpi.g .ic{background:rgba(62,207,142,.14);color:var(--ok)}.kpi.v .ic{background:rgba(181,140,255,.14);color:var(--vio)}
.kpi small{display:block;color:var(--mute);font-size:12px}.kpi .num{font-size:30px;line-height:1.1}
.stat{display:flex;gap:14px;align-items:center}.stat .ic{width:46px;height:46px;border-radius:14px;background:rgba(13,13,15,.07);color:var(--gold);display:grid;place-items:center;flex:none}
.stat small{color:var(--mute);display:block;font-size:12px}.stat b{font-family:'Oswald',system-ui;font-size:26px;font-weight:600;display:block;line-height:1.15}
.sect{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.sect h3{margin:0;font-size:15px;text-transform:uppercase;color:var(--gold);letter-spacing:1.2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button,.btn{font:inherit;border:0;border-radius:14px;padding:13px 18px;background:var(--grad);color:#fff;font-weight:700;cursor:pointer;transition:transform .08s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:scale(.97)}button:hover{filter:brightness(1.06)}
button.ghost{background:var(--s3);color:var(--text);border:1px solid var(--line)}
button.bad{background:linear-gradient(135deg,#ff7d89,#e0404f);color:#fff}button.ok{background:linear-gradient(135deg,#59e0a3,#26b878);color:#052a18}
button.sm{padding:8px 13px;font-size:13px;border-radius:11px}button:disabled{opacity:.38;filter:grayscale(.4)}
button.block{width:100%}
input,select,textarea{width:100%;background:var(--s3);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:13px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(13,13,15,.12)}
label{display:block;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin:12px 0 5px}
.mute{color:var(--mute)}hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.3px;background:var(--s3);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.waiting,.tag.present{color:#b26a00;background:rgba(245,166,35,.16)}.tag.in_chair,.tag.late{color:var(--info);background:rgba(90,167,255,.13)}
.tag.paid{color:var(--ok);background:rgba(62,207,142,.13)}.tag.void,.tag.off{color:var(--bad);background:rgba(255,93,108,.13)}.tag.break{color:var(--vio);background:rgba(181,140,255,.14)}.tag.none,.tag.out{color:var(--mute)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav.bottom div{pointer-events:auto;display:flex;max-width:536px;margin:0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 12px 30px -10px rgba(0,0,0,.28)}
nav.bottom button{flex:1;flex-direction:column;gap:3px;background:none;color:var(--mute);border-radius:18px;padding:9px 2px;font-size:10.5px;font-weight:600;letter-spacing:.2px}
nav.bottom button.on{color:#fff;background:var(--grad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:13px}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{flex:1;background:none;color:var(--mute);padding:11px;border-radius:12px}.seg button.on{background:var(--grad);color:#fff}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:0;text-align:left;min-height:138px;padding:14px;border-radius:var(--r);background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);color:var(--text)}
.item:hover{filter:none;border-color:#0d0d0f}.item .mono{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(13,13,15,.07);color:var(--gold);margin-bottom:10px}
.item.product .mono{background:rgba(181,140,255,.14);color:var(--vio)}
.item .nm{font-weight:600;font-size:15px;line-height:1.2}.item small{color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.item b{font-family:'Oswald',system-ui;font-size:21px;font-weight:600;color:var(--gold);margin-top:auto;padding-top:10px}
.item .plus{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center}
.cartbar{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));padding:0 14px;z-index:5;max-width:560px;margin:0 auto}
.cartbar button{box-shadow:0 12px 30px -8px rgba(0,0,0,.38);padding:15px}

.ticket{display:flex;gap:12px;align-items:flex-start;padding:14px;margin:10px 0 0;border-radius:16px;background:var(--s2);border:1px solid var(--line);border-left:4px solid #f5a623}
.ticket.in_chair{border-left-color:var(--info)}.ticket.paid{border-left-color:var(--ok)}.ticket.void{border-left-color:var(--bad);opacity:.7}
.ticket .no{font-family:'Oswald',system-ui;font-size:19px;font-weight:600;min-width:54px;height:46px;border-radius:12px;background:var(--s3);display:grid;place-items:center;color:var(--gold)}
.ticket .bd{flex:1;min-width:0}.ticket .bd b{display:block;font-size:15px}.ticket .bd small{color:var(--mute);font-size:12.5px}
.ticket .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s3);border:1px solid var(--line);font-family:'Oswald',system-ui;font-weight:600;color:var(--gold);flex:none}
.qty{display:flex;align-items:center;gap:10px}.qty button{padding:6px 13px;font-size:17px;border-radius:11px}
.fab{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:5}.fab button{box-shadow:0 12px 30px -8px rgba(0,0,0,.38)}

dialog{background:var(--s1);color:var(--text);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;margin:auto auto 0;max-height:92vh;overflow:auto;animation:up .22s ease-out}
dialog::before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:var(--line);margin:-10px auto 14px}
dialog::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(3px)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
main.enter>*{animation:fade .25s ease-out both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.login{text-align:center;padding:36px 22px 30px}.login .logo{width:84px;height:84px;margin:0 auto 14px;border-radius:24px;box-shadow:0 14px 40px -10px rgba(0,0,0,.35)}
.login h1{font-size:30px;margin:0;text-transform:uppercase;letter-spacing:2px}.login p{margin:4px 0 0}
.pin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px auto 6px;max-width:320px}
.pin button{background:var(--s2);border:1px solid var(--line);color:var(--text);font-family:'Oswald',system-ui;font-size:26px;font-weight:500;padding:16px 0;border-radius:20px}
.pin button.ghost{color:var(--mute)}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 8px}.dots i{width:15px;height:15px;border-radius:50%;background:var(--s3);border:1px solid var(--line);transition:.15s}
.dots i.on{background:var(--grad);border-color:transparent;transform:scale(1.15)}
.drawer a{display:flex;align-items:center;gap:14px;padding:15px 14px;border-radius:14px;color:var(--text);text-decoration:none;font-weight:600}
.drawer a:hover{background:var(--s2)}.drawer a svg{color:var(--gold)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;z-index:99;box-shadow:0 12px 30px -8px rgba(0,0,0,.3);animation:fade .2s}
.toast.err{background:linear-gradient(135deg,#ff7d89,#e0404f);color:#fff}

#print{display:none}
.paper{background:#fff;color:#111;font:12px/1.4 'Courier New',monospace;padding:14px;border-radius:8px;max-width:340px;margin:0 auto}
.paper .r{display:flex;justify-content:space-between;gap:10px}.paper .r span:last-child{text-align:right}.paper .c{text-align:center}.paper h3{text-align:center;margin:0 0 2px;font:700 14px 'Courier New',monospace}
.paper hr{border-top:1px dashed #111;margin:8px 0}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block}
  #print .paper{max-width:none;width:72mm;padding:0;margin:0;border-radius:0}
  @page{margin:4mm}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="sheet"></dialog>
<div id="print"></div>
<script src="/pos.js"></script>
</body>
</html>
