<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<title>Brotherhood</title>
<style>
:root{--bg:#0a0a0b;--s1:#121214;--s2:#1a1a1e;--s3:#232328;--line:#2a2a31;--text:#f4f1ea;--mute:#8d8b95;--gold:#e0b45a;--gold2:#b98a2e;
--grad:linear-gradient(135deg,#f3d58a,#c8942f);--ok:#3ecf8e;--bad:#ff5d6c;--info:#5aa7ff;--vio:#b58cff;--r:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 'Inter',system-ui,Segoe UI,sans-serif;background:radial-gradient(1100px 480px at 60% -180px,#2a1f0e 0,transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);display:flex;min-height:100vh}
h1,h2,h3,.num,.stat b{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;letter-spacing:.4px;font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

nav{width:248px;flex:none;background:linear-gradient(180deg,#101012,#0c0c0d);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
nav .brand{display:flex;align-items:center;gap:12px;padding:2px 8px 16px}
nav .brand img{width:42px;height:42px;border-radius:12px;box-shadow:0 8px 22px -8px rgba(224,180,90,.55)}
nav .brand h1{margin:0;font-size:19px;text-transform:uppercase;letter-spacing:1.6px;line-height:1.1}nav .brand small{color:var(--mute);font-size:11px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--mute);text-align:left;padding:9px 12px;border-radius:11px;font:inherit;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:var(--s2);color:var(--text)}
nav button.on{background:var(--grad);color:#1a1205;font-weight:700}
nav select{margin:0 0 10px}
.navh{color:#6c6b74;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;margin:16px 12px 4px}
main{flex:1;padding:26px 30px 50px;min-width:0;max-width:1280px}
h2{margin:0 0 18px;font-size:27px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2::after{content:"";flex-basis:100%;height:3px;width:64px;background:var(--grad);border-radius:3px;margin-top:6px}
h3{margin:0 0 12px;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:1.3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 10px 28px -16px #000}
.stat{position:relative;overflow:hidden}
.stat span{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:600}
.stat b{display:block;font-size:30px;margin-top:6px;line-height:1.1;color:var(--text)}
.stat:first-child{border-color:#6b5120;background:linear-gradient(135deg,#2a2010,#17130b 60%,#121214)}
.stat:first-child b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat:first-child::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(224,180,90,.25),transparent 70%)}
.stat small{display:block;margin-top:2px;color:var(--mute);font-size:11.5px}
button.btn,.btn{background:var(--grad);color:#1a1205;border:0;padding:9px 16px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s3);color:var(--text);border:1px solid var(--line)}.btn.bad{background:linear-gradient(135deg,#ff7d89,#e0404f);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}button:disabled{opacity:.38;cursor:default}
input,select,textarea{background:var(--s3);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:11px;font:inherit;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(224,180,90,.15)}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:12px 0 5px}
.overflow{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;position:sticky;top:0;background:var(--s2)}
tr:last-child td{border-bottom:0}tbody tr:hover td,table tr:hover td{background:rgba(255,255,255,.02)}
td.mute,.mute{color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--s3)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.booked{color:var(--gold);background:rgba(224,180,90,.12)}.tag.done{color:var(--ok);background:rgba(62,207,142,.13)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--line);cursor:pointer;font-weight:600}.chip.on{background:var(--grad);color:#1a1205;border-color:transparent}
dialog{background:var(--s1);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(480px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px #000}
dialog::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(3px)}
dialog h2{font-size:22px}
.online{max-width:420px;margin:8vh auto 0;width:100%;padding:30px}
.online .logo{width:76px;height:76px;border-radius:22px;display:block;margin:0 auto 12px;box-shadow:0 14px 40px -10px rgba(224,180,90,.5)}
.online h2{justify-content:center;text-align:center}.online h2::after{margin:6px auto 0}
nav{overflow-y:auto}button:disabled{opacity:.4;cursor:default}
@media(max-width:860px){
  body{flex-direction:column}
  nav{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
  nav .brand{padding:0 8px 0 0}nav .brand small,nav .brand h1{display:none}.navh{display:none}nav select{width:150px;flex:none;margin:0}
  nav button{white-space:nowrap;flex:none}nav button[data-act=logout]{margin-top:0!important}
  main{padding:18px 14px 40px}h2{font-size:22px}
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="view"></main>
<dialog id="modal"></dialog>
<script src="app.js"></script>
</body>
</html>
