<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<title>Brotherhood</title>
<style>
:root{--bg:#f5f5f6;--s1:#ffffff;--s2:#f7f7f8;--s3:#ececef;--line:#e1e1e6;--text:#0d0d0f;--mute:#6b6b76;--gold:#0d0d0f;--gold2:#000000;--grad:linear-gradient(135deg,#2c2c31,#000);--ok:#16a870;--bad:#e5384a;--info:#2b7de9;--vio:#7c4dff;--r:18px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 'Inter',system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
h1,h2,h3,.num,.stat b{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;letter-spacing:.4px;font-weight:600}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

nav{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
nav .brand{display:flex;align-items:center;gap:12px;padding:2px 8px 16px}
nav .brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 8px 22px -8px rgba(0,0,0,.35)}
nav .brand h1{margin:0;font-size:19px;text-transform:uppercase;letter-spacing:1.6px;line-height:1.1}nav .brand small{color:var(--mute);font-size:11px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--mute);text-align:left;padding:9px 12px;border-radius:11px;font:inherit;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:var(--s2);color:var(--text)}
nav button.on{background:var(--grad);color:#fff;font-weight:700}
nav select{margin:0 0 10px}
.navh{color:#6c6b74;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;margin:16px 12px 4px}
main{flex:1;padding:26px 30px 50px;min-width:0;max-width:1280px}
h2{margin:0 0 18px;font-size:27px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2::after{content:"";flex-basis:100%;height:3px;width:64px;background:var(--grad);border-radius:3px;margin-top:6px}
h3{margin:0 0 12px;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:1.3px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 6px 22px -14px rgba(0,0,0,.25)}
.stat{position:relative;overflow:hidden}
.stat span{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:600}
.stat b{display:block;font-size:30px;margin-top:6px;line-height:1.1;color:var(--text)}
.stat:first-child{border:0;background:linear-gradient(135deg,#25252a,#000)}.stat:first-child span,.stat:first-child small{color:#c2c2cc}
.stat:first-child b{color:#fff}
.stat:first-child::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.stat small{display:block;margin-top:2px;color:var(--mute);font-size:11.5px}
button.btn,.btn{background:var(--grad);color:#fff;border:0;padding:9px 16px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s3);color:var(--text);border:1px solid var(--line)}.btn.bad{background:linear-gradient(135deg,#ff7d89,#e0404f);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}button:disabled{opacity:.38;cursor:default}
input,select,textarea{background:var(--s3);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:11px;font:inherit;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(13,13,15,.12)}
label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:12px 0 5px}
.overflow{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:1px;font-weight:700;position:sticky;top:0;background:var(--s2)}
tr:last-child td{border-bottom:0}tbody tr:hover td,table tr:hover td{background:rgba(0,0,0,.03)}
td.mute,.mute{color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--s3)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.booked{color:#b26a00;background:rgba(245,166,35,.16)}.tag.done{color:var(--ok);background:rgba(62,207,142,.13)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border-radius:99px;background:var(--s2);border:1px solid var(--line);cursor:pointer;font-weight:600}.chip.on{background:var(--grad);color:#fff;border-color:transparent}
dialog{background:var(--s1);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(480px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(3px)}
dialog h2{font-size:22px}
.online{max-width:420px;margin:8vh auto 0;width:100%;padding:30px}
.online .logo{width:96px;height:96px;border-radius:50%;display:block;margin:0 auto 12px;box-shadow:0 14px 40px -10px rgba(0,0,0,.35)}
.th{width:38px;height:38px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;vertical-align:middle;background:var(--s3);color:var(--mute);font:600 13px 'Oswald',system-ui;flex:none}
.th.sq{border-radius:10px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.binfo{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--s2)}
.bpv{width:150px;aspect-ratio:16/10;border-radius:12px;background:var(--s3);overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center;flex:none}.bpv img{width:100%;height:100%;object-fit:cover}
.photo{display:flex;gap:14px;align-items:center}.photo .pv{width:92px;height:92px;border-radius:16px;background:var(--s3);overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:12px;flex:none;text-align:center}.photo .pv img{width:100%;height:100%;object-fit:cover}
.tier{display:inline-block;padding:2px 10px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.4px;background:var(--s3);color:var(--mute);text-transform:uppercase}
.tier.Bronze{background:#f3e3d3;color:#8a4f1d}.tier.Silver{background:#e6e8ee;color:#555b6a}.tier.Gold{background:#fdf0c4;color:#7a5c00}.tier.VIP{background:#000;color:#f3d58a}
.presets{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:2px;flex-wrap:wrap}
.presets button{background:none;border:0;color:var(--mute);font:inherit;font-weight:600;padding:7px 13px;border-radius:10px;cursor:pointer}
.presets button.on{background:#000;color:#fff}.presets button:hover:not(.on){color:var(--text)}
.chk input{flex:none}
.online h2{justify-content:center;text-align:center}.online h2::after{margin:6px auto 0}
nav{overflow-y:auto}button:disabled{opacity:.4;cursor:default}
#mtop,#scrim{display:none}
@media(max-width:860px){
  body{flex-direction:column}
  /* phone: slim top bar + slide-out menu, so Settings and everything else are one tap away */
  #mtop{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:9px 14px}
  #mtop[hidden]{display:none}
  #mtop .mb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;cursor:pointer;color:var(--text);padding:0}
  #mtop .mb svg{width:22px;height:22px}#mtop img{width:38px;height:38px;border-radius:50%}
  #mtop b{font:600 18px Oswald;text-transform:uppercase;letter-spacing:1px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav{position:fixed;left:0;top:0;bottom:0;width:min(310px,88vw);height:100%;z-index:50;transform:translateX(-104%);transition:transform .22s ease;box-shadow:none;padding:16px 12px 26px;overflow-y:auto}
  nav.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.45)}
  nav button{padding:12px 12px}nav select{margin-bottom:8px}
  #scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  main{padding:16px 14px 40px;max-width:100vw}h2{font-size:22px}
  main table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .row{gap:10px}.presets{width:100%}.presets button{flex:1;padding:9px 6px;font-size:13px}
  .bgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}
  dialog{width:96vw;padding:18px}
}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="mtop" hidden><button class="mb" data-act="menu" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><img src="/logo.png" alt=""><b id="mtitle">Brotherhood</b><button class="mb" id="mbell" data-act="bell" aria-label="Notifications" style="font-size:18px">🔔</button></header>
<div id="scrim" data-act="menu"></div>
<nav id="nav"></nav>
<main id="view"></main>
<dialog id="modal"></dialog>
<script src="app.js"></script>
<script src="/inbox.js"></script>
<script src="/update.js"></script>
</body>
</html>
