.ptxt{aspect-ratio:1;padding:26px 8px 8px;font-size:12px;overflow:hidden;background:linear-gradient(135deg,var(--s2),var(--s1));color:var(--text);word-break:break-word}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,139,.18);flex:none}.dot.off{background:var(--bad);box-shadow:0 0 0 4px rgba(255,84,104,.18)}
.bellb{position:relative}.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px 'Inter';text-align:center;padding:0 4px}
.heart.on{color:var(--bad)}.heart.on svg{fill:var(--bad)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--mute)}

/* ================= premium polish layer ================= */
input,select,textarea,button{font-family:inherit}
textarea{font:inherit;line-height:1.5}
:root{--bg:#060607;--s1:#101113;--s2:#17181b;--s3:#151619;--line:#212227;--mute:#979ba4;--r:18px;--disp:'Inter Tight','Inter',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{background:var(--bg);letter-spacing:-.006em;font-feature-settings:'cv11','ss01'}
body{background:radial-gradient(130% 55% at 50% -12%,#141821 0%,rgba(6,6,7,0) 60%),var(--bg);background-attachment:fixed}
h1,h2,h3,.num{font-family:var(--disp);font-weight:700;letter-spacing:-.022em}
.num{font-variant-numeric:tabular-nums}
.sec-h{margin:28px 0 12px}.sec-h h2{text-transform:none;font-size:21px;letter-spacing:-.025em}
.hero{border-radius:26px;padding:30px 22px;background:radial-gradient(120% 90% at 100% 0%,rgba(60,141,255,.22),transparent 55%),linear-gradient(160deg,#16181c,#0c0d0f 70%);border-color:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.45)}
.hero::after{display:none}
.hero h1{text-transform:none;font-size:38px;line-height:1.02;letter-spacing:-.04em}
.hero p{font-size:15.5px}
.bar{position:sticky;top:0;margin:0 -16px;padding:14px 16px 12px;background:rgba(6,6,7,.72);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid rgba(255,255,255,.05)}
.bar h2{font-size:21px!important;letter-spacing:-.025em}
.logo{font-family:var(--disp);letter-spacing:.14em}
/* surfaces */
.card,.bcard,.bigc,.svc,.pkg,.tile,.shop,.banner,.chero,.ctile,.sbox,.search,.tabs,.day,.slot,.mini button{background-image:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card,.bcard,.bigc,.svc,.pkg,.shop,.banner,.chero,.ctile{border-color:rgba(255,255,255,.065)}
.card,.bcard{border-radius:var(--r)}.bigc,.banner,.chero{border-radius:22px}
.card.empty,.empty{color:var(--mute)}
.card.empty{border-style:dashed;border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.015);box-shadow:none;padding:26px 18px;text-align:center;line-height:1.55}
/* motion and touch */
button,.btn,.chip,.tile,.bcard,.svc,.pkg,.slot,.day,.iconb,.shop,.stile{transition:transform .16s var(--ease),background-color .2s,border-color .2s,opacity .2s,box-shadow .2s}
.btn:active,.chip:active,.slot:active,.day:active,.iconb:active,.bcard:active,.tile:active,.pkg:active,.svc:active,.shop:active,.stile:active{transform:scale(.97)}
.pop{animation:fin .32s var(--ease)}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
/* buttons */
.btn{min-height:46px;border-radius:14px;font-weight:650;letter-spacing:-.01em;background:linear-gradient(180deg,#4a97ff,#2f7df5);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px rgba(47,125,245,.28)}
.btn.sm{min-height:36px;border-radius:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost,.btn.sec,.btn.danger{background:rgba(255,255,255,.04);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn.white{background:#fff;color:#08080a;box-shadow:0 8px 22px rgba(255,255,255,.08)}
.btn:disabled{box-shadow:none;filter:saturate(.5)}
.iconb,.bar .btn.sec{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08)}
/* inputs */
input,select,textarea{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.08);border-radius:14px;padding:13px 14px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(60,141,255,.16)}
.search{border-radius:16px;background-color:rgba(255,255,255,.04)}
/* chips, slots, days */
.chip{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.04);padding:8px 15px}
.chip.on{box-shadow:0 6px 16px rgba(255,255,255,.12)}
.slot,.day{border-color:rgba(255,255,255,.08)}
.slot.on,.day.on{background:linear-gradient(180deg,#4a97ff,#2f7df5);box-shadow:0 8px 20px rgba(47,125,245,.3)}
/* tags */
.tag{border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.05)}
/* floating bottom navigation */
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;max-width:540px;margin:0 auto;border:1px solid rgba(255,255,255,.08);border-radius:26px;background:rgba(16,17,20,.78);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:0 20px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.nav>div{max-width:none}
.nav button{border-radius:20px;padding:8px 0 7px;font-size:10.5px;font-weight:500;transition:color .2s,background-color .2s}
.nav button.on{background:rgba(255,255,255,.09);color:#fff}
#app{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.foot{background:rgba(10,11,13,.86);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid rgba(255,255,255,.07)}
/* sheets and toasts */
.sheet{border-radius:28px 28px 0 0;background:#121316;border-color:rgba(255,255,255,.08);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet:before{content:'';display:block;width:40px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 12px}
.lb{background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.toast{border-radius:14px;background:rgba(28,29,33,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.08);box-shadow:0 12px 30px rgba(0,0,0,.5);font-weight:500;bottom:calc(96px + env(safe-area-inset-bottom))}
/* skeleton loading */
.skel{display:grid;gap:12px;margin-top:6px}
.sk{border-radius:18px;background:linear-gradient(100deg,rgba(255,255,255,.035) 30%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.035) 70%);background-size:300% 100%;animation:shim 1.3s linear infinite;border:1px solid rgba(255,255,255,.04)}
.sk.h1{height:120px}.sk.h2{height:76px}.sk.h3{height:76px;opacity:.7}
@keyframes shim{from{background-position:100% 0}to{background-position:-200% 0}}
/* scrollbars stay hidden, focus is visible for keyboards */
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ----- phase 2: greeting, photo hero, quick actions, tickets, empty states, booking steps ----- */
.greet{margin:6px 0 14px}.greet h1{font-size:31px;letter-spacing:-.04em;margin-top:2px}
.hero.ph{padding:0;min-height:320px;display:flex;align-items:flex-end;background:#0b0c0e}
.hero .hero-bg{position:absolute;inset:0;background:url(/site/home-work2.jpg) center 28%/cover;opacity:.62;transform:scale(1.04)}
.hero.ph:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,7,.05) 10%,rgba(6,6,7,.55) 45%,rgba(6,6,7,.96) 92%);z-index:1}
.hero .hero-in{position:relative;z-index:2;padding:24px 20px 22px}
.hero.ph h1{font-size:34px}
.kicker{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#d6e6ff;background:rgba(60,141,255,.2);border:1px solid rgba(110,170,255,.35);padding:5px 11px;border-radius:99px;margin-bottom:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 6px}
.qa{display:grid;justify-items:center;gap:8px;background:none;border:0;padding:0;color:var(--text)}
.qa span{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.qa span svg{width:23px;height:23px}
.qa:first-child span{background:linear-gradient(180deg,#4a97ff,#2f7df5);border-color:transparent;box-shadow:0 10px 24px rgba(47,125,245,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.qa small{font-size:11.5px;font-weight:500;color:#c9ccd3;text-align:center;line-height:1.2}
.qa:active span{transform:scale(.94)}
.tkt2{display:flex;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),var(--s1);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.tk-d{width:80px;flex:none;display:grid;place-items:center;align-content:center;padding:14px 0;background:linear-gradient(180deg,#4a97ff,#2f7df5);color:#fff;text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:.12em;border-right:2px dashed rgba(6,6,7,.5)}
.tk-d b{font:800 34px/1 var(--disp);letter-spacing:-.04em;margin:3px 0}
.tk-b{flex:1;padding:14px 16px;min-width:0}
.tk-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(34,197,139,.15);color:#5fe0b0}
.ebox{display:grid;justify-items:center;text-align:center;gap:6px;padding:30px 20px;border:1px dashed rgba(255,255,255,.1);border-radius:22px;background:rgba(255,255,255,.015)}
.ebox .eic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:rgba(60,141,255,.12);color:#7fb2ff;margin-bottom:6px}
.ebox .eic svg{width:24px;height:24px}
.ebox b{font:700 17px var(--disp);letter-spacing:-.02em}.ebox .btn{margin-top:10px}
.steps{margin:2px 0 6px}.steps .sm{display:block;margin-top:8px}
.stp{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.stp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6aa9ff,#2f7df5);transition:width .45s var(--ease)}
.tg2{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 8px}.tg2:first-child{margin-top:4px}
.done{text-align:center;padding:18px 0 16px}
.done h1{font-size:30px;letter-spacing:-.04em;margin:14px 0 4px}
.ckc{width:76px;height:76px;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#3ee0a5,#16a777);color:#fff;box-shadow:0 0 0 10px rgba(34,197,139,.12),0 16px 40px rgba(34,197,139,.35);animation:pop2 .55s cubic-bezier(.2,1.4,.4,1)}
.ckc svg{width:36px;height:36px;stroke-width:3}
@keyframes pop2{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* ----- cropper, compact header logo, no sideways wobble ----- */
#app{overflow-x:clip}
@media(max-width:440px){.bar button+.logo span{display:none}.bar button+.logo img{width:28px;height:28px}}
.crop{position:relative;width:100%;overflow:hidden;border-radius:16px;background:#000;touch-action:none;cursor:grab;user-select:none;border:1px solid rgba(255,255,255,.1)}
.crop:active{cursor:grabbing}
.lb .crop img,.crop img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;max-height:none;border-radius:0;pointer-events:none;will-change:transform}
.crop.round:after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);pointer-events:none}
.crop:before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:33.34% 33.34%;opacity:.6}
input[type=range]{accent-color:var(--blue);height:28px}

/* ----- settings, edit profile ----- */
.glabel{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:24px 4px 10px}
.sprof{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--s1);color:var(--text);margin-top:4px}
.sprof .av{width:62px;height:62px}.sprof b{display:block;font:700 19px var(--disp);letter-spacing:-.02em}.sprof small{color:var(--mute);font-size:13px}
.chev{color:#5f636c;display:grid}.chev svg{width:18px;height:18px}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0 0;padding:14px 0;border-radius:20px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);text-align:center}
.sstats>div{border-left:1px solid rgba(255,255,255,.07)}.sstats>div:first-child{border-left:0}
.sstats b{display:block;font:700 22px var(--disp);letter-spacing:-.02em}.sstats span{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.probanner{display:flex;align-items:center;gap:12px;margin-top:12px;background:#fff;color:#0a0a0c;border-radius:20px;padding:14px 14px 14px 18px;box-shadow:0 10px 30px rgba(255,255,255,.06)}
.probanner b{display:block;font-weight:700;font-size:15px}.probanner small{color:#55575e;font-size:12.5px}
.probanner .btn{background:#0a0a0c;color:#fff;box-shadow:none;border-radius:99px;padding:8px 16px}
.sgroup{border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.065);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--s1)}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:none;border:0;border-top:1px solid rgba(255,255,255,.055);text-align:left;color:var(--text);border-radius:0}
.srow:first-child{border-top:0}.srow:active{background:rgba(255,255,255,.04);transform:none}
.srow .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none}.srow .si svg{width:19px;height:19px}
.srow b{display:block;font-weight:600;font-size:15.5px;letter-spacing:-.01em}.srow small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.ecover{height:150px;margin:4px -16px 0;background:linear-gradient(135deg,#1e2024,#0f1012) center/cover no-repeat;position:relative;border-bottom:1px solid rgba(255,255,255,.06)}
.ecbtns{position:absolute;right:12px;top:12px;display:flex;gap:8px}.ecbtns .btn{background:rgba(10,10,12,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);cursor:pointer}
.ecbtns svg,.camb svg{width:16px;height:16px}
.eav{position:relative;width:96px;margin:-48px auto 8px}
.camb{position:absolute;right:-2px;bottom:2px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#4a97ff,#2f7df5);color:#fff;border:3px solid var(--bg);cursor:pointer}

/* ================= discover, pro edition ================= */
.dhead{background:rgba(6,6,7,.8);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-bottom:1px solid rgba(255,255,255,.05);padding:12px 16px 12px}
.dhead .search{flex:1;min-width:0;margin:0}
.fbtn{width:48px;height:48px;border-radius:16px;flex:none}.fbtn.on{background:#fff;color:#08080a;border-color:#fff}
.banner.ph{position:relative;overflow:hidden;min-height:196px;padding:0;align-items:flex-end;background-size:cover;background-position:center 30%;border-color:rgba(255,255,255,.08)}
.banner.ph:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,7,0) 0%,rgba(6,6,7,.35) 35%,rgba(6,6,7,.92) 100%)}
.bnin{position:relative;padding:18px;width:100%}.bnin h3{font-size:23px;letter-spacing:-.03em;font-family:var(--disp)}.bnin p{color:rgba(255,255,255,.75);max-width:34ch}
.kick{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#cfe2ff;background:rgba(60,141,255,.22);border:1px solid rgba(120,175,255,.3);padding:3px 9px;border-radius:99px;margin-bottom:8px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pulse{display:flex;gap:10px;margin:14px 0 2px}.pulse>div{flex:1;font-size:12.5px;color:var(--mute);background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:6px}.pulse b{color:var(--text);font-size:15px}
.ldot{width:8px;height:8px;border-radius:50%;background:#34d27b;box-shadow:0 0 0 0 rgba(52,210,123,.6);animation:lp 2s infinite;flex:none}
@keyframes lp{70%{box-shadow:0 0 0 7px rgba(52,210,123,0)}100%{box-shadow:0 0 0 0 rgba(52,210,123,0)}}
.srow1{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}.srow1::-webkit-scrollbar{display:none}
.srow1 .stile{flex:none;width:76px}.srow1 .stile img,.srow1 .stile .g{width:66px;height:66px;border:2px solid rgba(255,255,255,.08);box-shadow:0 6px 18px rgba(0,0,0,.35)}.srow1 .stile.on img,.srow1 .stile.on .g{border-color:var(--blue);box-shadow:0 0 0 3px rgba(60,141,255,.25)}
.srow1 .stile span.tl{font-size:11.5px;color:rgba(255,255,255,.8);padding:0 2px}
.opill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--mute)}.opill i{width:6px;height:6px;border-radius:50%;background:#6b6f78}.opill.on{color:#5ee39a}.opill.on i{background:#34d27b}.opill.soon{color:#ffc35c}.opill.soon i{background:#ffb020}
.tile .tbadge{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(10,10,12,.62);border:1px solid rgba(255,255,255,.1);font-weight:600}
.bigc.pro{border-radius:24px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.bigc.pro .bigimg{height:236px;place-items:center;align-content:end}
.bigc.pro .bigimg:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 48%,rgba(6,6,7,.9) 100%);pointer-events:none}
.tagrow.top{top:12px;bottom:auto;left:12px;right:56px}.bigc.pro .mtag{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(10,10,12,.55);border:1px solid rgba(255,255,255,.12);font-weight:600}
.bigc.pro .hbtn{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:rgba(10,10,12,.5);border:1px solid rgba(255,255,255,.12);top:12px;right:12px;width:36px;height:36px}
.bigcap{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 12px;display:flex;align-items:flex-end;gap:10px;text-align:left}
.bav{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.9);flex:none}
.bnm{font:700 21px/1.1 var(--disp);letter-spacing:-.025em;color:#fff;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bnm .ver svg{width:17px;height:17px}
.bsub{font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rpill{flex:none;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:#fff;background:rgba(10,10,12,.55);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:5px 9px;border-radius:99px}.rpill em{font-style:normal;font-weight:500;color:rgba(255,255,255,.6);font-size:11.5px}
.bigc.pro .bigb{padding:12px 14px 14px}
.bmeta{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}

/* ================= Brotherhood luxe: the design system (overrides everything above) =================
   Warm near-black, ivory text, one champagne accent used sparingly, hairlines instead of boxes, a display serif for headings
   and figures. Primary actions are ivory; gold marks what is special (points, active state, the one key action). */
:root{--bg:#0b0a09;--s1:#131210;--s2:#1a1815;--s3:#1f1d1a;--line:rgba(242,236,226,.085);--line2:rgba(242,236,226,.15);--text:#f2ece2;--mute:#a59f95;--dim:#78736b;
  --gold:#c8a86c;--gold2:#e2cb98;--goldbg:rgba(200,168,108,.1);--blue:#c8a86c;--accent:#c8a86c;--ok:#8fbf9f;--bad:#e3907f;
  --disp:'Cormorant Garamond',Georgia,'Times New Roman',serif;--r:18px;--ease:cubic-bezier(.22,.8,.24,1)}
html,body{background:var(--bg);color:var(--text);letter-spacing:-.003em;font-feature-settings:'cv11'}
body{background:radial-gradient(120% 46% at 50% -8%,#191510 0%,rgba(11,10,9,0) 62%),var(--bg);background-attachment:fixed}
::selection{background:rgba(200,168,108,.35)}
h1,h2,h3,.num{font-family:var(--disp);font-weight:600;letter-spacing:-.004em;font-variant-numeric:lining-nums proportional-nums;font-feature-settings:'lnum' 1}
h1{line-height:1.04}
.mute{color:var(--mute)}
a{color:inherit}.link{color:var(--gold2)}
svg.i{stroke-width:1.55}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:2px}

/* header and wordmark */
.bar{background:rgba(11,10,9,.78);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2)}
.bar h2{font-family:var(--disp);font-size:25px!important;font-weight:600;letter-spacing:-.004em}
.logo{font:600 25px var(--disp);letter-spacing:.005em;text-transform:none;gap:10px}
.logo img{width:28px;height:28px;filter:grayscale(1) sepia(.5) saturate(1.6) brightness(1.15) hue-rotate(-8deg)}
.logo b{color:var(--gold);font-weight:600}
.iconb,.bar .btn.sec{background:transparent;border:1px solid var(--line2);box-shadow:none}
.badge{background:var(--gold);color:#17130b;font:700 10.5px/18px 'Inter';box-shadow:0 0 0 2px var(--bg)}

/* type helpers */
.sec-h{margin:32px 0 12px}.sec-h h2{font-family:var(--disp);text-transform:none;letter-spacing:-.004em;font-size:26px;font-weight:600}
.sec-h .mute,.sec-h .link{font-size:13px}
.glabel,.tg2{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--text);margin:28px 2px 10px}
.kicker,.kick{background:none;border:0;padding:0;margin-bottom:10px;border-radius:0;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:rgba(242,236,226,.72);-webkit-backdrop-filter:none;backdrop-filter:none}
.ctabs button{letter-spacing:0;font-size:13px;font-weight:500}.ctabs button.on{color:var(--text);border-bottom-color:var(--gold)}

/* surfaces: flat, warm, one hairline */
.card,.bcard,.bigc,.svc,.pkg,.tile,.shop,.chero,.ctile,.sbox,.search,.day,.slot,.mini button,.sgroup,.sprof,.tkt2{background:var(--s1);background-image:none;border:1px solid var(--line);box-shadow:none}
.card,.bcard,.sgroup,.sprof{border-radius:var(--r)}
.bigc,.chero,.tkt2{border-radius:20px}
.card.empty,.ebox,.dempty{border:1px solid var(--line);border-style:solid;background:transparent;border-radius:20px}
.card.tk{background:var(--s1)}

/* buttons: ivory primary, hairline secondary, no glow */
.btn{background:var(--text);color:#0d0c0a;border:0;border-radius:12px;min-height:48px;font-weight:600;letter-spacing:.003em;box-shadow:none;background-image:none}
.btn svg.i{stroke-width:1.9}
.btn.sm{min-height:38px;border-radius:10px;padding:8px 14px;font-size:13.5px;box-shadow:none}
.btn.ghost,.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(227,144,127,.38);box-shadow:none}
.btn.white{background:var(--text);color:#0d0c0a;box-shadow:none}
.btn.gold{background:var(--gold);color:#17130b}
.btn:disabled{opacity:.4;filter:none}
.btn:active{transform:scale(.98)}

/* inputs */
input,select,textarea{background:rgba(242,236,226,.03);border:1px solid var(--line2);border-radius:12px;color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,select:focus,textarea:focus{border-color:rgba(200,168,108,.7);box-shadow:0 0 0 3px rgba(200,168,108,.12)}
label.f{color:var(--mute);font-size:13px}
.search{border-radius:14px;background:rgba(242,236,226,.03)}
input[type=range]{accent-color:var(--gold)}

/* chips, tabs, tags, days and slots */
.chip{background:transparent;border:1px solid var(--line2);color:var(--mute);box-shadow:none}
.chip.on,.tag.on{background:var(--text);border-color:var(--text);color:#0d0c0a;box-shadow:none}
.tabs{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:22px;justify-content:flex-start}
.tabs button{flex:0 0 auto;padding:10px 0 12px;border-radius:0;color:var(--dim);font-weight:500;font-size:14.5px}
.tabs button.on{background:none;color:var(--text);box-shadow:inset 0 -1.5px 0 var(--gold)}
.tabs.scroll button{padding:10px 0 12px}
.tag{background:transparent;border:1px solid var(--line2);color:var(--mute);font-weight:500;padding:3px 10px}
.tag.ok{color:var(--ok);border-color:rgba(143,191,159,.32);background:transparent}
.tag.bad{color:var(--bad);border-color:rgba(227,144,127,.34);background:transparent}
.gold{background:var(--goldbg);color:var(--gold2);border:1px solid rgba(200,168,108,.35)}
.rankc{background:transparent;border-color:var(--line2)}
.day,.slot{color:var(--mute)}.day b{font-family:var(--disp);font-size:22px;color:var(--text)}
.day.on,.slot.on{background:var(--text);border-color:var(--text);color:#0d0c0a;box-shadow:none;background-image:none}.day.on b{color:#0d0c0a}
.svc.on{border-color:rgba(200,168,108,.6);background:var(--s2)}.svc.on .chk{background:var(--gold);border-color:var(--gold);color:#17130b}
.chk{border:1.5px solid var(--line2)}
.stp{background:var(--s3);height:3px}.stp i{background:var(--gold)}
.bar2{height:4px}.bar2 i.good{background:var(--gold)}.bar2 i.warn{background:#b8935a}
.hs{font-family:var(--disp);background:transparent;border-color:var(--line2)}.hs.good{color:var(--gold2);border-color:rgba(200,168,108,.4);background:var(--goldbg)}
.ok{background:rgba(143,191,159,.07);border-color:rgba(143,191,159,.28);color:#c4dfcc}
.err{background:rgba(227,144,127,.07);border-color:rgba(227,144,127,.3);color:#f2c3b8}

/* bottom navigation: a quiet bar, gold dot on the active tab */
.nav{left:0;right:0;bottom:0;max-width:none;margin:0;padding:6px 10px env(safe-area-inset-bottom);border:0;border-top:1px solid var(--line);border-radius:0;background:rgba(11,10,9,.86);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);box-shadow:none}
.nav>div{max-width:640px;margin:0 auto}
.nav button{position:relative;border-radius:0;padding:9px 0 13px;color:var(--dim);font-size:10.5px;font-weight:500;letter-spacing:.01em}
.nav button svg{stroke-width:1.5}
.nav button.on{background:none;color:var(--text)}.nav button.on svg{stroke:var(--text)}
.nav button.on:after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.foot{background:rgba(11,10,9,.9);border-top:1px solid var(--line)}

/* sheets, toasts, lightbox */
.sheet{background:#12110f;border:0;border-top:1px solid var(--line2);border-radius:26px 26px 0 0;box-shadow:0 -30px 80px rgba(0,0,0,.6);padding:12px 20px calc(18px + env(safe-area-inset-bottom))}
.sheet:before{width:36px;height:4px;background:var(--s3);margin:0 auto 16px}
.sheet h3{font-family:var(--disp);font-size:26px;font-weight:600;margin:0 0 14px}
.toast{background:rgba(26,24,21,.96);border:1px solid var(--line2);color:var(--text)}
.skel .sk{background:linear-gradient(100deg,rgba(242,236,226,.025) 30%,rgba(242,236,226,.06) 50%,rgba(242,236,226,.025) 70%);background-size:300% 100%;border:1px solid var(--line)}

/* home: greeting, photo hero, quick actions */
.greet h1{font-family:var(--disp);font-size:40px;font-weight:600;letter-spacing:-.006em;line-height:1.02}
.hero{border:1px solid var(--line);background:var(--s1);box-shadow:none}
.hero.ph{min-height:330px;background:#0b0a09;border-radius:22px}
.hero .hero-bg{opacity:1;filter:saturate(.5) contrast(1.08) brightness(.7) sepia(.2);transform:scale(1.03)}
.hero.ph:before{background:linear-gradient(180deg,rgba(11,10,9,.05) 15%,rgba(11,10,9,.5) 50%,rgba(11,10,9,.95) 94%)}
.hero h1,.hero.ph h1{font-family:var(--disp);font-size:36px;font-weight:600;letter-spacing:-.006em;line-height:1.03}
.hero p{color:rgba(242,236,226,.72)}
.quick{gap:6px;margin:22px 0 4px}
.qa span{width:58px;height:58px;border-radius:50%;background:transparent;border:1px solid var(--line2);box-shadow:none}
.qa:first-child span{background:var(--text);color:#0d0c0a;border-color:var(--text);box-shadow:none}
.qa span svg{width:21px;height:21px;stroke-width:1.5}
.qa small{color:var(--mute);font-size:12px}

/* bookings: the ticket */
.tk-d{background:transparent;color:var(--mute);border-right:1px dashed var(--line2);text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
.tk-d b{font:600 46px/0.95 var(--disp);color:var(--gold2);letter-spacing:0;font-variant-numeric:lining-nums;margin:4px 0}
.tk-pill{background:var(--goldbg);color:var(--gold2);border:1px solid rgba(200,168,108,.32);font-weight:500;font-size:12px}
.ebox .eic,.dei{background:transparent;border:1px solid var(--line2);border-radius:50%;color:var(--gold)}
.ebox b,.dempty b{font:600 24px var(--disp);letter-spacing:-.004em}
.ckc{background:transparent;border:1px solid var(--gold);color:var(--gold);box-shadow:0 0 0 10px rgba(200,168,108,.06)}
.done h1{font-family:var(--disp);font-size:34px;font-weight:600}

/* profile and settings */
.sprof b{font:600 25px var(--disp);letter-spacing:-.004em}
.sstats{border:1px solid var(--line);background:var(--s1);border-radius:var(--r)}
.sstats b{font:600 30px/1.1 var(--disp);font-variant-numeric:lining-nums}
.sstats span{font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--mute)}
.probanner{background:var(--s1);color:var(--text);border:1px solid rgba(200,168,108,.28);box-shadow:none}
.probanner small{color:var(--mute)}
.probanner .btn{background:var(--gold);color:#17130b;border-radius:10px}
.srow{border-top:1px solid var(--line)}
.srow .si{background:transparent;border:1px solid var(--line2);border-radius:50%;color:var(--gold2)}
.srow b{font-size:15px}
.chev{color:var(--dim)}
.av{background:var(--s2);color:var(--mute);font-family:'Inter';font-weight:600;font-size:16px}
.av.lg{box-shadow:0 0 0 1.5px var(--gold);border-color:var(--bg)}
.camb{background:var(--text);color:#0d0c0a}
.ver,.ver svg{color:var(--gold);fill:var(--gold)}
.star{color:var(--gold)}

/* discover and barber cards */
.dhead,.fbar{background:rgba(11,10,9,.84);border-bottom:1px solid var(--line)}
.banner{border:1px solid var(--line)}
.banner.ph{background-color:#0b0a09}
.banner.ph:before{background:linear-gradient(180deg,rgba(20,15,8,.25) 0%,rgba(11,10,9,.45) 40%,rgba(11,10,9,.95) 100%)}
.bnin h3{font:600 28px/1.05 var(--disp);letter-spacing:-.006em}
.dots span.on{background:var(--gold)}
.pulse>div{background:transparent;border:1px solid var(--line)}
.srow1 .stile.on img,.srow1 .stile.on .g{border-color:var(--gold);box-shadow:none}
.stile em{background:var(--gold);color:#17130b}
.bigc.pro{box-shadow:none}
.bigc.pro .bigimg{filter:saturate(.7) contrast(1.04)}
.bnm{font:600 25px/1.05 var(--disp);letter-spacing:-.004em}
.rpill,.bigc.pro .mtag,.bigc.pro .hbtn,.tile .tbadge{background:rgba(11,10,9,.6);border-color:rgba(242,236,226,.16)}
.nfree{color:var(--ok);background:transparent;border-color:rgba(143,191,159,.3)}
.opill.on{color:var(--ok)}.opill.on i{background:var(--ok)}.opill.soon{color:var(--gold2)}.opill.soon i{background:var(--gold)}
.bfrom span{text-transform:none;letter-spacing:0;font-size:11.5px}
.bfrom b{font-family:var(--disp);font-size:22px}
.brandt{background:var(--goldbg);color:var(--gold2);border-color:rgba(200,168,108,.3)}
.tile .tp.ph,.bigimg .ph{font-family:var(--disp);color:var(--dim)}
.pin{background:var(--gold);border-color:var(--text)}
.ldot{background:var(--ok);animation:none}
.dot{box-shadow:none}
.chiprow span,.bstyles span{background:transparent;border-color:var(--line2)}
.ptabs{background:transparent;border:1px solid var(--line)}.ptabs button.on{background:var(--s2)}.ptabs button.on svg{stroke:var(--gold)}
@media(prefers-color-scheme:light){:root{color-scheme:dark}}

.stile.on .g.ini{border-color:var(--gold)!important;background:var(--goldbg)}

.dot{background:var(--gold)}.dot.off{background:var(--dim)}

.tabs:has(> button:nth-child(5))::-webkit-scrollbar{display:none}
.av{font-family:var(--disp);font-weight:600;font-size:21px;color:var(--gold2)}.av.lg{font-size:36px}

.banner.ph{border-color:var(--line)}
/* luxe, round 8 */
.pcover{filter:saturate(.35) contrast(1.05) brightness(.42) sepia(.25)!important}
.hero:not(.ph)::before{content:"Brotherhood";display:block;font:600 24px var(--disp);color:var(--gold2);margin-bottom:34px;letter-spacing:.01em}
.card.tk{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 0 18px}
.list:has(> .card.tk){gap:0}
.card.tk .tkno{min-width:40px;height:40px;border-radius:11px}
/* ================= brand blue (the owner's brand colour; overrides the gold above) =================
   Same layout and type; neutral near-black and the Brotherhood blue as the one accent. */
:root{--bg:#08090b;--s1:#121316;--s2:#181a1e;--s3:#1e2126;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--text:#f4f5f7;--mute:#a3a8b1;--dim:#878c95;
  --gold:#3c8dff;--gold2:#8ab8ff;--goldbg:rgba(60,141,255,.12);--blue:#3c8dff;--accent:#3c8dff;--ok:#5fd3a2;--bad:#ff7a86}
body{background:radial-gradient(120% 46% at 50% -8%,#111724 0%,rgba(8,9,11,0) 62%),var(--bg)}
::selection{background:rgba(60,141,255,.35)}
.bar,.dhead,.fbar{background:rgba(8,9,11,.94)}
.nav{background:rgba(8,9,11,.88)}
.foot{background:rgba(8,9,11,.92)}
.sheet{background:#111215}
.toast{background:rgba(24,26,30,.96)}
/* primary action: the brand blue (flat, no glow) */
.btn,.btn.white{background:var(--blue);color:#fff}
.btn.gold{background:var(--blue);color:#fff}
.btn.ghost,.btn.sec{background:transparent;color:var(--text)}
.btn:disabled{background:transparent;color:var(--dim)}
.bar>.btn:not(.sec):not(.ghost){background:transparent;color:var(--text)}
.day.on,.slot.on{background:var(--blue);border-color:var(--blue);color:#fff}.day.on b{color:#fff}
.qa:first-child span{background:var(--blue);border-color:var(--blue);color:#fff}
.camb{background:var(--blue);color:#fff}
.svc.on .chk{color:#fff}
.probanner .btn{background:transparent;color:var(--gold2);border-color:rgba(60,141,255,.5)}
.badge{color:#fff}
.stile em{color:#fff}
/* the logo is the brand: mark back, blue in the wordmark */
.logo{font:700 19px 'Inter',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.logo img{display:block;width:28px;height:28px;filter:none}
.logo b{color:var(--blue);font-weight:700}
/* photos: neutral grade, no sepia */
.hero .hero-bg{filter:saturate(.75) contrast(1.06) brightness(.72)}
.tile .tp,.shop img,.pcard>img,.grid3 img,.bigimg,.ecover{filter:saturate(.85) contrast(1.04) brightness(.9)}
.tile .tp.ph,.bigimg:not([style*=url]){filter:none}
.pcover{filter:saturate(.6) contrast(1.05) brightness(.5)!important}
.stile .g .sa,.stile img,.pa svg,.sart .sa{filter:grayscale(1) brightness(.9) contrast(1.05)}
.tile .tp.ph{background:radial-gradient(90% 90% at 30% 20%,#1b2230 0%,#121316 70%);color:rgba(138,184,255,.6)}
.banner.ph:before{background:linear-gradient(180deg,rgba(8,9,11,.15) 0%,rgba(8,9,11,.45) 40%,rgba(8,9,11,.95) 100%)}
.hero.ph:before{background:linear-gradient(180deg,rgba(8,9,11,.05) 15%,rgba(8,9,11,.5) 50%,rgba(8,9,11,.95) 94%)}
.tfree,.opill.on,.nfree{color:var(--ok)}.opill.on i,.dot,.ldot{background:var(--ok)}.nfree{border-color:rgba(95,211,162,.3)}
.err{background:rgba(255,122,134,.07);border-color:rgba(255,122,134,.3);color:#ffc2c8}
.ok{background:rgba(95,211,162,.07);border-color:rgba(95,211,162,.28);color:#bdeed8}
/* round 10 */
.ctiles{grid-template-columns:1fr}
.chero{padding:20px}.chero h2{font-size:28px}
.glabel{font:600 23px var(--disp);color:var(--text);margin:30px 2px 12px;letter-spacing:-.004em}
.hero .hero-in p{max-width:30ch}
.btn svg.i{vertical-align:middle;width:17px;height:17px}
.chips{padding-right:24px}
.sstats b.word{font-size:22px}
.kpi .sm span{opacity:.45;font-size:.85em}
.ptag{background:rgba(8,9,11,.7);letter-spacing:.04em}
/* ================= motion: springy, quick, plays once per screen ================= */
/* The page is drawn again when its data arrives. Every entrance animation starts at --el (minus the time already played),
   so an element redrawn mid-animation carries on from where it was instead of bouncing again. --dl is the stagger. */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--glide:cubic-bezier(.2,.9,.25,1.05)}
@media(prefers-reduced-motion:no-preference){
  #app .pop{animation:none}
  #app.enter>*:not(.bar):not(.nav):not(.dhead):not(.fbar):not(.hscroll):not(.banners):not(.srow1):not(.stiles){animation:rise .52s var(--glide) both;animation-delay:calc(var(--dl,0s) + var(--el,0s))}
  #app.enter>*:nth-child(2){--dl:.03s}#app.enter>*:nth-child(3){--dl:.07s}#app.enter>*:nth-child(4){--dl:.11s}#app.enter>*:nth-child(5){--dl:.15s}
  #app.enter>*:nth-child(6){--dl:.19s}#app.enter>*:nth-child(7){--dl:.23s}#app.enter>*:nth-child(8){--dl:.27s}#app.enter>*:nth-child(9){--dl:.3s}#app.enter>*:nth-child(n+10){--dl:.33s}
  #app.enter .hscroll>*,#app.enter .banners>*,#app.enter .srow1>*{animation:slideIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--dl,0s) + var(--el,0s))}
  #app.enter .hscroll>*:nth-child(2),#app.enter .srow1>*:nth-child(2),#app.enter .banners>*:nth-child(2){--dl:.06s}
  #app.enter .hscroll>*:nth-child(3),#app.enter .srow1>*:nth-child(3),#app.enter .banners>*:nth-child(3){--dl:.12s}
  #app.enter .hscroll>*:nth-child(n+4),#app.enter .srow1>*:nth-child(n+4){--dl:.18s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  @keyframes slideIn{from{opacity:0;transform:translateX(28px)}}
  /* taps: a quick squeeze and a springy release */
  button,.btn,.card,.tile,.bcard,.svc,.chip,.qa span,.day,.slot,.shop,.stile,.ptstrip,.srow,.ctile{transition:transform .42s var(--spring),background-color .2s,border-color .2s,color .2s,opacity .2s}
  button:active,.btn:active,.tile:active,.bcard:active,.svc:active,.chip:active,.day:active,.slot:active,.shop:active,.stile:active,.ptstrip:active,.ctile:active{transform:scale(.955);transition-duration:.08s}
  .qa:active span{transform:scale(.9);transition-duration:.08s}
  .srow:active{transform:scale(.985)}
  /* bottom sheets spring up over a fading backdrop (a sheet is drawn once) */
  .lb{animation:fadeIn .22s ease both}
  .lb .sheet{animation:sheetUp .5s cubic-bezier(.17,1.12,.3,1) both}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes sheetUp{from{transform:translateY(105%)}}
  /* when a screen opens: the active tab pops, bars fill, rings and the badge pop, the hero settles */
  #app.enter .nav button.on svg{animation:navPop .5s var(--spring) both;animation-delay:var(--el,0s)}
  #app.enter .nav button.on:after{animation:dotIn .4s var(--spring) both;animation-delay:var(--el,0s)}
  @keyframes navPop{0%{transform:scale(.78)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes dotIn{from{transform:scale(0)}}
  #app.enter .pts-bar i,#app.enter .stp i,#app.enter .bar2 i{transform-origin:left center;animation:fill 1s var(--glide) both;animation-delay:calc(.15s + var(--el,0s))}
  .lb .pts-bar i{transform-origin:left center;animation:fill 1s var(--glide) .15s both}
  @keyframes fill{from{transform:scaleX(0)}}
  #app.enter .pts-ring.on,#app.enter .pts-ok{animation:ringIn .6s var(--spring) both;animation-delay:calc(.35s + var(--el,0s))}
  .lb .pts-ring.on,.lb .pts-ok{animation:ringIn .6s var(--spring) .35s both}
  @keyframes ringIn{from{transform:scale(.6);opacity:0}}
  #app.enter .badge.dotb{animation:ringIn .5s var(--spring) both;animation-delay:calc(.4s + var(--el,0s))}
  #app.enter .hero .hero-bg{animation:settle 1.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--el,0s)}
  @keyframes settle{from{transform:scale(1.12)}}
  .toast{animation:toastIn .45s var(--spring) both}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.94)}}
}
/* round 11: delivery-app patterns, one hue, quieter queue */
.spill{display:flex;align-items:center;gap:10px;width:100%;margin:14px 0 4px;padding:0 16px;height:50px;border-radius:999px;background:var(--s1);border:1px solid var(--line2);color:var(--mute);font-size:14.5px;text-align:left}
.spill svg{width:19px;height:19px;color:var(--text)}
.quick{gap:10px}.qa span{width:64px;height:64px;border-radius:20px;background:var(--s1);border:1px solid var(--line)}.qa span svg{color:var(--blue);width:24px;height:24px}
.qa:first-child span svg{color:#fff}
.tfree,.opill.on,.nfree{color:var(--gold2)}.opill.on i,.dot,.ldot{background:var(--blue)}.nfree{border-color:rgba(60,141,255,.35)}
.chip.on,.tag.on{background:var(--goldbg);border-color:rgba(60,141,255,.55);color:var(--text)}
.card.tk .btn:not(.sec):not(.danger):not(.gold){background:var(--goldbg);color:var(--gold2);border:1px solid rgba(60,141,255,.4)}
.hero:not(.ph)::before{content:none}
#app>.bar+*{margin-top:14px}
#app>.bar.overcover+.phead{margin-top:46px}
.card,.bcard,.sgroup,.sprof,.tile,.svc,.pkg{border-radius:20px}
.btn{border-radius:14px}.btn.sm{border-radius:11px}
.btn.round,.btn.sm.round{border-radius:50%}
/* photos fade in once when they arrive; a photo already loaded shows at once after a redraw */
#app img:not(.ld){opacity:0}
#app img{transition:opacity .35s ease}
#app img.now{transition:none}
#app .bigimg.ld:not(.now),#app .pcover.ld:not(.now),#app .ecover.ld:not(.now){animation:photoIn .4s ease both}
@keyframes photoIn{from{opacity:.3}}
@media(prefers-reduced-motion:reduce){#app .bigimg,#app .pcover{animation:none!important}}
#app .bigimg[style*="url("]:not(.ld),#app .pcover[style*="url("]:not(.ld),#app .ecover[style*="url("]:not(.ld){background-image:none!important}
#app .bigimg[style*="url("],#app .pcover[style*="url("],#app .ecover[style*="url("]{transition:opacity .35s ease}
@media(prefers-reduced-motion:reduce){#app img{opacity:1!important}}
.ptstrip+*{margin-top:14px}
.tabs{box-shadow:none;background-image:none}
.card.empty .emh{display:block;font:600 24px var(--disp);color:var(--text);margin-bottom:4px}
.card.empty:has(.emh){padding:34px 18px}
.card.idle{background:transparent}
.btn:not(.sec):not(.ghost):not(.danger):not(:disabled),.btn.white,.btn.gold,.day.on,.slot.on,.qa:first-child span{background:#2f7df5;border-color:#2f7df5}
</style>
